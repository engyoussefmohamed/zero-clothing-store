<div class="container">
    <h1>بروفايل المستخدم</h1>
    
    <!-- قسم تفاصيل الحساب -->
    <div id="user-details" class="user-section">
        <h2>تفاصيل الحساب</h2>
        <div id="user-info">
            <!-- سيتم ملء هذا ديناميكيًا -->
        </div>
        <button id="edit-profile">تحديث البيانات</button>
    </div>
    
    <!-- نموذج تحديث البيانات (مخفي افتراضيًا) -->
    <div id="edit-form-section" class="user-section" style="display: none;">
        <h2>تحديث البيانات</h2>
        <form id="profile-form">
            <label for="user-name">الاسم:</label>
            <input type="text" id="user-name" name="name" required>
            
            <label for="user-email">البريد الإلكتروني:</label>
            <input type="email" id="user-email" name="email" required>
            
            <label for="user-address">العنوان:</label>
            <textarea id="user-address" name="address" required></textarea>
            
            <button type="submit">حفظ التغييرات</button>
            <button type="button" id="cancel-edit">إلغاء</button>
        </form>
    </div>
    
    <!-- قسم السلة -->
    <div id="profile-cart" class="user-section">
        <h2>محتويات السلة</h2>
        <div id="profile-cart-items">
            <!-- سيتم ملء هذا ديناميكيًا -->
        </div>
        <div id="cart-total" style="text-align: center; font-size: 20px; margin-top: 20px;"></div>
        <button id="clear-profile-cart">إفراغ السلة</button>
    </div>
</div>
