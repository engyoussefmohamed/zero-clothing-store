    <div class="container">
        <h1>اطلب منتجاتك</h1>
    <div class="alert" id="success-message">تم إرسال الطلب بنجاح!</div>
<form action="#" method="post" id="order-form" data-user="true">
    <label for="name">الاسم:</label>
    <input type="text" id="name" name="name" required aria-required="true">
    
    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" name="email" required aria-required="true">
    
    <label for="product">المنتج:</label>
    <select id="product" name="product" aria-required="true">
        <option value="قميص أبيض">قميص أبيض</option>
        <option value="جينز أزرق">جينز أزرق</option>
        <option value="بنطال رسمي">بنطال رسمي</option>
        <option value="فستان أحمر">فستان أحمر</option>
    </select>
    
    <label for="quantity">الكمية:</label>
    <input type="number" id="quantity" name="quantity" min="1" required aria-required="true">
    
    <label for="address">العنوان:</label>
    <textarea id="address" name="address" required aria-required="true"></textarea>
    
    <button type="submit">إرسال الطلب</button>
</form>
</div>
